#
# This workflow calls the main distribution pipeline from DuckDB to build, test and (optionally) release the extension
#
name: Main Extension Distribution Pipeline
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: true

jobs:
  duckdb-stable-build:
    name: Build extension binaries
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5.5
    with:
      duckdb_version: v1.5.5
      ci_tools_version: v1.5.5
      extension_name: jsono
      # Empty on purpose: build exactly the set the community pipeline builds by default — the nine
      # platforms whose matrix entry is not `opt_in` (linux amd64/arm64, osx amd64/arm64, windows_amd64,
      # windows_amd64_mingw, wasm mvp/eh/threads). The three opt-in targets (both musl builds,
      # windows_arm64) stay out because the community build skips them too unless a descriptor asks.
      #
      # This costs macOS and arm64 runner minutes, which are billed per-minute here — accepted so that
      # breakage on a platform we ship is found by our own CI rather than by the community rebuild.
      # Four platform bugs shipped invisibly to this repo until the platforms were first built
      # (2026-07-30, see docs/debugging.md and the v0.1.0 history); this is what keeps that from
      # happening again. reduced_ci_mode is deliberately left at its default so the matrix keeps
      # tracking whatever the community pipeline does with it.
      exclude_archs: ''

  code-quality-check:
    name: Code Quality Check
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_code_quality.yml@v1.5.5
    with:
      duckdb_version: v1.5.5
      ci_tools_version: v1.5.5
      extension_name: jsono
      format_checks: 'format;tidy'
